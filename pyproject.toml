[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genexp"
version = "0.1.0"
description = "A package for Generative Exploration functionality"
requires-python = ">=3.10,<3.12"
dependencies = [
  "diffusiongym",
  "tqdm",
  "optuna>=4.9.0",
]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = ["ipykernel", "jupyter", "jupyterlab", "pytest"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/genexp"]

